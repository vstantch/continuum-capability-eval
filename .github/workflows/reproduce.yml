name: reproduce

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Correctness vectors
        working-directory: feasibility
        run: python test_vectors.py
      - name: Regenerate X2 and X3 data
        working-directory: feasibility
        run: |
          python x4_sizes.py
          python x2_sim.py
      - name: X1 provenance
        working-directory: feasibility
        run: python check_x1_provenance.py
      - name: Regenerate tables
        working-directory: feasibility
        run: python mkresults.py
      - name: Outputs must be byte-identical
        run: git diff --exit-code
